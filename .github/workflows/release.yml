name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Rename build output for release
        run: |
          mkdir -p release
          cp dist/index.js release/opencode-usage-bar.js
          cp dist/index.d.ts release/opencode-usage-bar.d.ts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/opencode-usage-bar.js
            release/opencode-usage-bar.d.ts
